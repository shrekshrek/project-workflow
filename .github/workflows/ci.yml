name: Agent Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-all.cjs
      - name: Check release version
        id: version
        shell: bash
        run: |
          subject=$(git log -1 --format=%s)
          if [[ "$subject" == "release: "* ]]; then
            version=$(cat VERSION)
            if [[ "$subject " != "release: v$version "* ]]; then
              echo "::error::Release subject must start with release: v$version"
              exit 1
            fi
            if git diff --quiet HEAD^ HEAD -- VERSION; then
              echo "::error::Release requires a new VERSION"
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: validate
    if: github.event_name == 'push' && needs.validate.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag the validated release commit
        run: |
          version=$(cat VERSION)
          git push origin "HEAD:refs/tags/v$version"
